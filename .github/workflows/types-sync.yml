name: types-sync

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      wc_version:
        description: 'Specific WC version to (re)capture before diffing. Omit to use committed snapshots only.'
        required: false
        type: string
  pull_request:
    branches: [main]

# Least privilege: only the diff job, which files the tracking issue, can
# write issues. The capture job runs WordPress/WooCommerce code downloaded
# from upstream and gets read-only access.
permissions:
  contents: read

concurrency:
  group: types-sync-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # Read the committed support window so downstream jobs can fan out across versions.
  window:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
      latest: ${{ steps.read.outputs.latest }}
      versions_json: ${{ steps.read.outputs.versions_json }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          file=scripts/types-sync/support-window.json
          versions=$(jq -r '.versions | join(",")' "$file")
          versions_json=$(jq -c '.versions' "$file")
          latest=$(jq -r '.latest' "$file")
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "versions_json=$versions_json" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  # Always capture a fresh upstream snapshot before diffing.
  # On workflow_dispatch, uses the explicit wc_version input; otherwise falls
  # back to the latest version from support-window.json (used by schedule runs).
  capture:
    needs: window
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ github.event.inputs.wc_version || needs.window.outputs.latest }}
    steps:
      - uses: actions/checkout@v4

      # The version can come from a workflow_dispatch input, so accept only a
      # plain version number before it's used in paths and commands.
      - name: Validate WooCommerce version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid WooCommerce version; expected e.g. 10.7.0."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Boot WP + WC
        env:
          WOO_COMMERCE_VERSION: ${{ env.VERSION }}
        run: pnpm wp:env:rebuild

      - name: Read provisioned REST keys
        id: keys
        run: |
          file=infra/wordpress/scripts/generated-app-passwords.txt
          if [ ! -f "$file" ]; then
            echo "::warning::No REST key file at $file — capture will fail for admin/analytics surfaces"
            exit 0
          fi
          pwd=$(grep -m1 -i 'WP_ADMIN_APP_PASSWORD' "$file" | sed 's/.*= *//')
          echo "::add-mask::$pwd"
          echo "pwd=$pwd" >> "$GITHUB_OUTPUT"

      - name: Capture
        env:
          WC_VERSION: ${{ env.VERSION }}
          WP_CONSUMER_KEY: admin
          WP_CONSUMER_SECRET: ${{ steps.keys.outputs.pwd }}
        run: pnpm types:sync:capture --wc-version "$VERSION"

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ env.VERSION }}
          path: scripts/types-sync/snapshots/wc-${{ env.VERSION }}.json

  # The diff job consumes the committed snapshots (and any freshly-captured
  # one from the `capture` step) and produces a report. Always runs against
  # the full support window — the reconciler downgrades drift covered by
  # older supported versions.
  diff:
    needs: [window, capture]
    if: ${{ always() && needs.window.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      LATEST: ${{ needs.window.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Pull any freshly-captured snapshot back into the snapshots dir so the
      # diff sees the latest data even before it's been committed.
      - name: Restore freshly-captured snapshot (if any)
        if: ${{ needs.capture.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          path: scripts/types-sync/snapshots
          merge-multiple: true

      # Exit codes: 0 = clean, 1 = drift found, 2 = the tool itself failed.
      # The code is recorded so a crash isn't reported as schema drift.
      - name: Diff against SDK types (full support window)
        id: check
        run: |
          set +e
          pnpm types:sync:check
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Run registry-completeness test (strict)
        env:
          TYPES_SYNC_REGISTRY: strict
        run: pnpm types:sync:test
        continue-on-error: true

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-${{ needs.window.outputs.latest }}
          path: scripts/types-sync/out/

      # One tracking issue, found by its labels, so it survives WooCommerce
      # version bumps; its title is kept current with the latest version.
      - name: Open / update tracking issue on drift
        if: always() && steps.check.outputs.code == '1' && hashFiles('scripts/types-sync/out/drift.md') != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          TITLE: 'Schema drift: WooCommerce ${{ needs.window.outputs.latest }}'
        run: |
          gh label create "types-sync"    --color "0075ca" --description "Type synchronisation" --force
          gh label create "schema-drift"  --color "e4e669" --description "WooCommerce schema drift detected" --force

          # GitHub caps issue bodies at 65536 chars.
          # If the report fits, include it in full; otherwise upload it as a gist
          # (permanent, human-readable) and link to it — artifacts expire and require
          # downloading a zip, making them a poor experience for issue reviewers.
          # Gist creation requires a PAT with the `gist` scope stored as GH_GIST_TOKEN;
          # GITHUB_TOKEN is repo-scoped and cannot create gists.
          LIMIT=65536
          body=$(cat scripts/types-sync/out/drift.md)
          body_file=$(mktemp)
          if [ ${#body} -gt $LIMIT ]; then
            if [ -n "$GH_GIST_TOKEN" ]; then
              gist_url=$(GH_TOKEN="$GH_GIST_TOKEN" gh gist create scripts/types-sync/out/drift.md \
                --desc "Schema drift report: WooCommerce $LATEST" \
                --filename "drift-$LATEST.md")
              printf '> [!NOTE]\n> The drift report is too large to display inline (exceeds the 65 536-character GitHub limit).\n> The full report has been uploaded as a gist: **[drift-%s.md](%s)**\n' \
                "$LATEST" "$gist_url" > "$body_file"
            else
              RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              printf '> [!NOTE]\n> The drift report is too large to display inline (exceeds the 65 536-character GitHub limit).\n> Download the full report from the **[`drift-%s` CI artifact](%s)**.\n> To enable automatic gist uploads, add a PAT with the `gist` scope as the `GH_GIST_TOKEN` repository secret.\n' \
                "$LATEST" "$RUN_URL" > "$body_file"
            fi
          else
            printf '%s' "$body" > "$body_file"
          fi

          existing=$(gh issue list \
            --label "types-sync" --label "schema-drift" \
            --state open \
            --json number \
            --jq ".[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$TITLE" --body-file "$body_file"
            echo "Updated issue #$existing"
          else
            gh issue create \
              --title "$TITLE" \
              --body-file "$body_file" \
              --label "types-sync" --label "schema-drift"
          fi

      - name: Close tracking issue if drift resolved
        if: steps.check.outputs.code == '0' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list \
            --label "types-sync" --label "schema-drift" \
            --state open \
            --json number \
            --jq ".[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --body "Schema drift resolved — \`pnpm types:sync:check\` passed against WooCommerce \`$LATEST\` ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))."
            gh issue close "$existing" --reason completed
            echo "Closed issue #$existing"
          else
            echo "No open drift issue to close."
          fi
